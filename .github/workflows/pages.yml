name: Deploy public physics index

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check_public_release.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public-only release
        run: python3 scripts/check_public_release.py
      - uses: actions/configure-pages@v5
        if: vars.ENABLE_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true'
        with:
          path: docs
  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public index only
        id: deployment
        uses: actions/deploy-pages@v4
